<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somaiya Pharmaceuticals - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Somaiya Pharmaceuticals</h1>
        <p>Your trusted online pharmacy</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
    </nav>
    <main>
        <h2 class="center">Create Your Account</h2>
        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" required>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>
            <label for="gender">Gender</label>
            <select id="gender">
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
            </select>
            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" required></textarea>
            <label for="pass">Password</label>
            <input type="password" id="pass" required>
            <label for="cpass">Confirm Password</label>
            <input type="password" id="cpass" required>
            <label><input type="checkbox" required> I agree to the terms and conditions</label>
            <button type="submit">Register</button>
        </form>
        <p class="center">Already have an account? <a href="login.html">Login here</a></p>
    </main>
    <footer>
        <p>&copy; 2026 Somaiya Pharmaceuticals. All rights reserved.</p>
    </footer>
</body>
</html>
